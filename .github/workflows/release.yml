name: Release Rootless and RootHide Packages
run-name: "iFetch release · ${{ github.ref_name }}"

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      THEOS: ${{ github.workspace }}/.build-tools/theos
      THEOS_COMMIT: 16362d3aa83a0acd56df4493d575d34306d42478
      ROOTHIDE_THEOS: ${{ github.workspace }}/.build-tools/roothide-theos
      ROOTHIDE_THEOS_COMMIT: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore build tools
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.THEOS }}
            ${{ env.ROOTHIDE_THEOS }}
            /Users/runner/Library/Caches/Homebrew
          key: ifetch-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}-${{ env.ROOTHIDE_THEOS_COMMIT }}-v2

      - name: Install build tools
        run: |
          set -euo pipefail

          if [[ ! -d "$THEOS/.git" ]]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
            git -C "$THEOS" checkout "$THEOS_COMMIT"
            git -C "$THEOS" submodule update --init --recursive
          fi

          if [[ ! -d "$ROOTHIDE_THEOS/.git" ]]; then
            git clone --recursive https://github.com/roothide/theos.git "$ROOTHIDE_THEOS"
            git -C "$ROOTHIDE_THEOS" checkout "$ROOTHIDE_THEOS_COMMIT"
            git -C "$ROOTHIDE_THEOS" submodule update --init --recursive
          fi

          for formula in ldid dpkg xz; do
            brew list "$formula" >/dev/null 2>&1 || brew install "$formula"
          done

      - name: Validate release version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' src/control)"
          test "$version" = "$GITHUB_REF_NAME"
          test -f "release-notes/${version}.md"
          src/scripts/validate_project.sh

      - name: Build rootless package
        run: make -C src clean package FINALPACKAGE=1

      - name: Build RootHide package
        run: THEOS="$ROOTHIDE_THEOS" make -C src clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Verify packages
        run: |
          set -euo pipefail
          rootless_package="packages/com.wee1ka.ifetch_${GITHUB_REF_NAME}_iphoneos-arm64.deb"
          roothide_package="packages/com.wee1ka.ifetch_${GITHUB_REF_NAME}_iphoneos-arm64e.deb"

          test -f "$rootless_package"
          test -f "$roothide_package"
          test "$(dpkg-deb -f "$rootless_package" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$roothide_package" Architecture)" = "iphoneos-arm64e"

          rootless_invalid="$(
            dpkg-deb -c "$rootless_package" |
            awk '{print $6}' |
            sed 's#^\./##' |
            grep -Ev '^(|var/?|var/jb(/|$))' || true
          )"
          roothide_invalid="$(
            dpkg-deb -c "$roothide_package" |
            awk '{print $6}' |
            sed 's#^\./##' |
            grep -Ev '^(|Applications(/|$)|Library(/|$)|usr(/|$)|var(/|$))' || true
          )"

          test -z "$rootless_invalid"
          test -z "$roothide_invalid"
          src/scripts/validate_project.sh
          shasum -a 256 "$rootless_package" > "${rootless_package}.sha256"
          shasum -a 256 "$roothide_package" > "${roothide_package}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "packages/com.wee1ka.ifetch_${GITHUB_REF_NAME}_iphoneos-arm64.deb" \
            "packages/com.wee1ka.ifetch_${GITHUB_REF_NAME}_iphoneos-arm64.deb.sha256" \
            "packages/com.wee1ka.ifetch_${GITHUB_REF_NAME}_iphoneos-arm64e.deb" \
            "packages/com.wee1ka.ifetch_${GITHUB_REF_NAME}_iphoneos-arm64e.deb.sha256" \
            --verify-tag \
            --title "iFetch ${GITHUB_REF_NAME}" \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md"

      - name: Publish Sileo repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sileo-repo.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$GITHUB_REF_NAME"
