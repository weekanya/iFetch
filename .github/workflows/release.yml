name: Release Rootless Package
run-name: "iFetch release · ${{ github.ref_name }}"

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/.build-tools/theos
      THEOS_COMMIT: 16362d3aa83a0acd56df4493d575d34306d42478

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore build tools
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.THEOS }}
            /Users/runner/Library/Caches/Homebrew
          key: ifetch-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}-v1

      - name: Install build tools
        run: |
          set -euo pipefail

          if [[ ! -d "$THEOS/.git" ]]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
            git -C "$THEOS" checkout "$THEOS_COMMIT"
            git -C "$THEOS" submodule update --init --recursive
          fi

          for formula in ldid dpkg xz; do
            brew list "$formula" >/dev/null 2>&1 || brew install "$formula"
          done

      - name: Validate release version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' src/control)"
          test "$version" = "$GITHUB_REF_NAME"
          test -f "release-notes/${version}.md"
          src/scripts/validate_project.sh

      - name: Build rootless package
        run: make -C src clean package FINALPACKAGE=1

      - name: Verify package
        run: |
          set -euo pipefail
          package="packages/com.wee1ka.ifetch_${GITHUB_REF_NAME}_iphoneos-arm64.deb"
          test -f "$package"

          invalid_paths="$(
            dpkg-deb -c "$package" |
            awk '{print $6}' |
            sed 's#^\./##' |
            grep -Ev '^(|var/?|var/jb(/|$))' || true
          )"

          test -z "$invalid_paths"
          shasum -a 256 "$package" > "${package}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "packages/com.wee1ka.ifetch_${GITHUB_REF_NAME}_iphoneos-arm64.deb" \
            "packages/com.wee1ka.ifetch_${GITHUB_REF_NAME}_iphoneos-arm64.deb.sha256" \
            --verify-tag \
            --title "iFetch ${GITHUB_REF_NAME}" \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md"
