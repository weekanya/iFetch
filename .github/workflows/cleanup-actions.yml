name: Clean Actions History

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' |
          while IFS= read -r run_id; do
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done
