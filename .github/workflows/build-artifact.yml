name: Build Rootless and RootHide Artifacts
run-name: "iFetch artifact · ${{ github.ref_name }} · #${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - ".github/workflows/build-artifact.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build-artifact.yml"

permissions:
  contents: read

concurrency:
  group: build-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      THEOS: ${{ github.workspace }}/.build-tools/theos
      THEOS_COMMIT: 16362d3aa83a0acd56df4493d575d34306d42478
      ROOTHIDE_THEOS: ${{ github.workspace }}/.build-tools/roothide-theos
      ROOTHIDE_THEOS_COMMIT: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore build tools
        id: tools-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.THEOS }}
            ${{ env.ROOTHIDE_THEOS }}
            /Users/runner/Library/Caches/Homebrew
          key: ifetch-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}-${{ env.ROOTHIDE_THEOS_COMMIT }}-v2

      - name: Install build tools
        run: |
          set -euo pipefail

          if [[ ! -d "$THEOS/.git" ]]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
            git -C "$THEOS" checkout "$THEOS_COMMIT"
            git -C "$THEOS" submodule update --init --recursive
          fi

          if [[ ! -d "$ROOTHIDE_THEOS/.git" ]]; then
            git clone --recursive https://github.com/roothide/theos.git "$ROOTHIDE_THEOS"
            git -C "$ROOTHIDE_THEOS" checkout "$ROOTHIDE_THEOS_COMMIT"
            git -C "$ROOTHIDE_THEOS" submodule update --init --recursive
          fi

          for formula in ldid dpkg xz; do
            brew list "$formula" >/dev/null 2>&1 || brew install "$formula"
          done

      - name: Validate source
        run: src/scripts/validate_project.sh

      - name: Build rootless package
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/ifetch-rootless-build.log"

          if make -C src clean package FINALPACKAGE=1 2>&1 | tee "$build_log"; then
            exit 0
          fi

          grep -E 'error:|fatal error:|undefined symbol|ld: |make(\\[[0-9]+\\])?: \\*\\*\\*' "$build_log" |
          tail -n 80 |
          while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

          exit 1

      - name: Build RootHide package
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/ifetch-roothide-build.log"

          if THEOS="$ROOTHIDE_THEOS" make -C src clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee "$build_log"; then
            exit 0
          fi

          grep -E 'error:|fatal error:|undefined symbol|ld: |make(\\[[0-9]+\\])?: \\*\\*\\*' "$build_log" |
          tail -n 80 |
          while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

          exit 1

      - name: Inspect and describe artifacts
        id: package
        env:
          TOOLS_CACHE_HIT: ${{ steps.tools-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^Version: //p' src/control)"
          rootless_package="packages/com.wee1ka.ifetch_${version}_iphoneos-arm64.deb"
          roothide_package="packages/com.wee1ka.ifetch_${version}_iphoneos-arm64e.deb"
          rootless_name="$(basename "$rootless_package")"
          roothide_name="$(basename "$roothide_package")"

          test -f "$rootless_package"
          test -f "$roothide_package"
          test "$(dpkg-deb -f "$rootless_package" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$roothide_package" Architecture)" = "iphoneos-arm64e"

          rootless_invalid="$(
            dpkg-deb -c "$rootless_package" |
            awk '{print $6}' |
            sed 's#^\./##' |
            grep -Ev '^(|var/?|var/jb(/|$))' || true
          )"
          roothide_invalid="$(
            dpkg-deb -c "$roothide_package" |
            awk '{print $6}' |
            sed 's#^\./##' |
            grep -Ev '^(|Applications(/|$)|Library(/|$)|usr(/|$)|var(/|$))' || true
          )"

          test -z "$rootless_invalid"
          test -z "$roothide_invalid"
          src/scripts/validate_project.sh

          mkdir -p artifact
          cp "$rootless_package" "$roothide_package" artifact/
          dpkg-deb -I "$rootless_package" > artifact/ROOTLESS_PACKAGE_CONTROL.txt
          dpkg-deb -c "$rootless_package" > artifact/ROOTLESS_PACKAGE_CONTENTS.txt
          dpkg-deb -I "$roothide_package" > artifact/ROOTHIDE_PACKAGE_CONTROL.txt
          dpkg-deb -c "$roothide_package" > artifact/ROOTHIDE_PACKAGE_CONTENTS.txt

          (
            cd artifact
            shasum -a 256 "$rootless_name" > "$rootless_name.sha256"
            shasum -a 256 "$roothide_name" > "$roothide_name.sha256"
          )

          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_version="$(xcodebuild -version | tr '\n' ' ')"
          rootless_sha256="$(shasum -a 256 "$rootless_package" | awk '{print $1}')"
          roothide_sha256="$(shasum -a 256 "$roothide_package" | awk '{print $1}')"
          generated_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          cat > artifact/BUILD_INFO.md <<EOF
          # iFetch ${version} development build

          This automated artifact contains conventional rootless and RootHide packages. It is not a GitHub Release and is not published to the Sileo repository.

          ## Packages

          - \`${rootless_name}\`: \`iphoneos-arm64\`, rootless, \`/var/jb\`, SHA-256 \`${rootless_sha256}\`
          - \`${roothide_name}\`: \`iphoneos-arm64e\`, RootHide, randomized jailbreak root, SHA-256 \`${roothide_sha256}\`

          ## Included components

          - iFetch application
          - WidgetKit extension
          - Control Center module
          - Terminal command \`ifetch\`
          - Restricted privileged helper
          - Device images and localized resources

          ## Build information

          - Commit: \`${GITHUB_SHA}\`
          - Branch or tag: \`${GITHUB_REF_NAME}\`
          - Workflow run: \`${GITHUB_RUN_NUMBER}\`
          - Runner: \`${RUNNER_OS} ${RUNNER_ARCH}\`
          - Build tools cache hit: \`${TOOLS_CACHE_HIT:-false}\`
          - Xcode: \`${xcode_version}\`
          - iPhoneOS SDK: \`${sdk_version}\`
          - Generated: \`${generated_at}\`
          EOF

          cat artifact/BUILD_INFO.md >> "$GITHUB_STEP_SUMMARY"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: iFetch-${{ steps.package.outputs.version }}-rootless-roothide-build-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
